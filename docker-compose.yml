version: '3.8'

services:
  scanner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: quant-scanner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/New_York
    volumes:
      - /mnt/fast/quant-data/data:/app/data
      - /mnt/fast/quant-data/logs:/app/logs
      - ./data/tickers.txt:/app/data/tickers.txt
      # New read-only mount giving access to finance-vibe's data
      - /mnt/fast/finance-vibe-data:/app/finance_vibe_data:ro
    command: tail -f /dev/null
    ports:
      - "5001:5000"