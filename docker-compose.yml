services:
  scanner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: quant-scanner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/New_York
    volumes:
      - /mnt/fast/quant-data/data:/app/data
      - /mnt/fast/quant-data/logs:/app/logs
      # finance-vibe log outputs (read-only) for digest email embed
      - /mnt/fast/finance-vibe-data:/app/finance_vibe_data:ro
    command: scheduler
    ports:
      - "5001:5000"
