version: '3.8'

services:
  scanner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: quant-scanner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: America/New_York
    volumes:
      - /mnt/fast/quant-data/data:/app/data
      - /mnt/fast/quant-data/logs:/app/logs
      - ./data/tickers.txt:/app/data/tickers.txt
    command: scheduler
    ports:
      - "5001:5000"